[package]
name = "unipn-transfer"
version = "0.1.0"
edition = "2024"
description = "Converters from external formats (ConcIR JSON, Dot, later PNML) into UniPN nets"
license = "MIT"
repository = "https://github.com/kevindadi/UniPN"

[dependencies]
unipn = { path = ".." }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# No `concir` here. The drift check against ConcIR's own AST lives in
# `schema-sync/`, a separate workspace: a path dev-dependency into the submodule
# is resolved with the rest of the workspace and made `unipn` itself fail to
# build in a clone without the submodule. See `schema-sync/Cargo.toml`.
