[package]
name = "unipn"
version = "0.2.0"
edition = "2024"
description = "Extensible Petri-net model library for P/T, colored, timed, and abstract verification nets"
license = "MIT"
repository = "https://github.com/kevindadi/UniPN"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
