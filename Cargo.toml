[package]
name = "unipn"
version = "0.2.0"
edition = "2024"
description = "Extensible Petri-net model library for P/T, colored, timed, and abstract verification nets"
license = "MIT"
repository = "https://github.com/kevindadi/UniPN"

[features]
default = ["invariants"]
# Reserved: time/priority extension (Transition.timing/.priority,
# AnalysisMode::Timed, bridge to PTPN state-class DBM analysis).
timed = []
# Place/transition invariant computation (Gaussian nullspace, exact BigInt).
invariants = [
    "dep:num-bigint",
    "dep:num-rational",
    "dep:num-traits",
    "dep:num-integer",
]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
num-bigint = { version = "0.4", optional = true }
num-rational = { version = "0.4", optional = true }
num-traits = { version = "0.2", optional = true }
num-integer = { version = "0.1", optional = true }

[dev-dependencies]
serde_json = "1"
