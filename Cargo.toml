[package]
name = "unipn"
version = "0.2.0"
edition = "2024"
description = "A generic Petri-net model shared by P/T, timed, and colored verification nets"
license = "MIT"
repository = "https://github.com/kevindadi/UniPN"

[features]
default = ["timed"]
# DBM / state-class reachability (`analysis::timed`). The timed *model*
# (`TimedNet`, discrete `NetLike`) is always available; clock zones stay
# in `StateClass`, not in `NetLike::State`.
timed = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "timed_analysis"
required-features = ["timed"]
