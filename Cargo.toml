[package]
name = "unipn"
version = "0.1.0"
edition = "2024"
description = "Unified Petri Net — a fast, extensible Petri net core shared by CVN (ConcIR verification), MIR-to-PN (Rust source analysis), test-case generation, and timed/priority (PTPN) analysis"
license = "MIT"
repository = "https://github.com/kevindadi/UniPN"

[features]
default = ["invariants"]
# 预留：时间/优先级扩展（Transition.timing/.priority、AnalysisMode::Timed、
# 对接 PTPN 的状态类 DBM 分析桥）。
timed = []
# 库位/变迁不变量计算（Gaussian nullspace，BigInt 精确）。
invariants = [
    "dep:num-bigint",
    "dep:num-rational",
    "dep:num-traits",
    "dep:num-integer",
]

[dependencies]
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
indexmap = "2"
num-bigint = { version = "0.4", optional = true }
num-rational = { version = "0.4", optional = true }
num-traits = { version = "0.2", optional = true }
num-integer = { version = "0.1", optional = true }

[dev-dependencies]
serde_json = "1"
