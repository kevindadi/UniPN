[package]
name = "unipn"
version = "0.2.0"
edition = "2024"
description = "A generic Petri-net model shared by P/T, timed, and colored verification nets"
license = "MIT"
repository = "https://github.com/kevindadi/UniPN"

# `unipn` stays the root package so a downstream `path = "../UniPN"` keeps
# resolving; the converters are members alongside it.
[workspace]
members = ["transfer"]
# The ConcIR submodule is a reference, not a member: its schema and its examples
# are what `unipn-transfer` reads and tests against, but nothing here builds it.
exclude = ["third_party"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["timed"]
# DBM / state-class reachability (`analysis::timed`). The timed *model*
# (`TimedNet`, discrete `NetLike`) is always available; clock zones stay
# in `StateClass`, not in `NetLike::State`.
timed = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[[test]]
name = "timed_analysis"
required-features = ["timed"]
